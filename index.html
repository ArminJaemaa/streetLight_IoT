<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Street Light Controller</title>
  <!-- MQTT Browser Library -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      background: #1e1e24;
      color: #fff;
      padding-top: 40px;
    }
    .status {
      font-size: 14px;
      margin-bottom: 25px;
      color: #aaa;
    }
    .status span { font-weight: bold; }
    .btn {
      display: block;
      width: 250px;
      margin: 12px auto;
      padding: 15px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-green  { background: #2ecc71; color: white; }
    .btn-yellow { background: #f39c12; color: white; }
    .btn-cross  { background: #1021e2; color: white; }
    .btn-gray   { background: #7f8c8d; color: white; }
  </style>
</head>
<body>

  <h2>🚦 Street Light Remote</h2>
  <div class="status">Broker Status: <span id="status-text" style="color: #f1c40f;">Connecting...</span></div>

  <button class="btn btn-green" onclick="sendMode('NORMAL')">Tavaline</button>
  <button class="btn btn-yellow" onclick="sendMode('NIGHT')">Kollased vilkuvad</button>
  <button class="btn btn-red" onclick="sendMode('YOU_SHALL_PASS')">Inimene tahab üle</button>
  <button class="btn btn-gray" onclick="sendMode('OFF')">Kinni</button>

  <script>
    const TOPIC = "TrafficIoTTLU2k26/mode";

    const client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');

    client.on('connect', () => {
      document.getElementById('status-text').innerText = "Connected";
      document.getElementById('status-text').style.color = "#2ecc71";
    });

    client.on('error', (err) => {
      console.error(err);
      document.getElementById('status-text').innerText = "Error Connecting";
      document.getElementById('status-text').style.color = "#e74c3c";
    });

    function sendMode(mode) {
      if (client.connected) {
        client.publish(TOPIC, mode);
        console.log("Sent mode:", mode);
      } else {
        alert("Not connected to MQTT broker yet!");
      }
    }
  </script>
</body>
</html>
